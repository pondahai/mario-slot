# 把整個 repo 當靜態網站發佈到 GitHub Pages。
# 沒有建置步驟 —— index.html / styles.css / script.js / assets 直接上傳。
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  # 需要從其他分支手動部署時，到 Actions 分頁挑分支執行
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；新的推送不打斷正在跑的那次
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 試過 enablement: true（想讓 action 自己把 Pages 開起來），不行：
      #   Create Pages site failed. Error: Resource not accessible by integration
      # GITHUB_TOKEN 就算有 pages: write，也只能部署到「已存在」的 Pages 站台；
      # 建立站台要 repo admin 權限，內建 token 拿不到。所以第一次一定要人工去
      # Settings → Pages → Source 選 GitHub Actions（或改傳一組有 admin 的 PAT）。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4

# 把整個 repo 當靜態網站發佈到 GitHub Pages。
# 沒有建置步驟 —— index.html / styles.css / script.js / assets 直接上傳。
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  # 需要從其他分支手動部署時，到 Actions 分頁挑分支執行
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；新的推送不打斷正在跑的那次
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true 會直接用 API 把 Pages 開起來（build_type 設成 workflow），
      # 不需要先去 Settings → Pages 手動選 Source。靠上面的 pages: write 權限。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
